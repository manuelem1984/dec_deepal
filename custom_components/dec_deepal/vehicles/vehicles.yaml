# =============================================================================
# DEC Deepal — Catálogo de VEHÍCULOS (modelos, versiones, colores y fotos)
# =============================================================================
#
# Este fichero describe cada modelo de coche soportado: cómo reconocerlo en la
# respuesta del servidor, qué funciones tiene (para crear solo las entidades
# que tienen sentido), sus versiones (acabados), sus colores y sus fotos.
#
# -----------------------------------------------------------------------------
# LA FICHA DE CADA COCHE
# -----------------------------------------------------------------------------
# Todo lo que la integración sabe de un coche sale de aquí: es su FICHA. Se
# compone por capas, de lo general a lo concreto:
#
#   1. El MODELO dice lo común (funciones, testigos, fotos, mantenimiento).
#      Sus valores son los de la versión más equipada (en el S05, el Max).
#   2. Cada VERSIÓN solo escribe en qué se diferencia ("funciones:", "llanta:").
#   3. Un coche sin versión elegida, o con una versión que aquí no existe,
#      usa la ficha del modelo tal cual (es decir, la del Max).
#   4. Un modelo puede copiar a otro con "como:" y cambiar solo lo distinto
#      (el S05 PHEV copia al S05 EV).
#   5. Un coche sin modelo elegido usa "generico": lo mínimo.
#
# "verificada: true" = comprobada en un coche real. Las demás salen de los
# catálogos oficiales de España (S05 EV, septiembre de 2026; S05 PHEV, 2026) y
# se afinan con los diagnósticos de quien tenga ese coche (el diagnóstico dice
# qué ficha se está usando y si está verificada).
#
# Tras editarlo, reiniciar Home Assistant.
# Guía completa: docs/imagenes.md y docs/anadir-pais-vehiculo-idioma.md
#
# -----------------------------------------------------------------------------
# CAMPOS DE CADA MODELO
# -----------------------------------------------------------------------------
#   nombre          Nombre que se muestra (ficha del dispositivo, opciones).
#   nombre_con_version
#                   (opcional) Nombre cuando se conoce la versión; {version}
#                   se sustituye por el nombre de la versión. Ejemplo:
#                   "Deepal S05 {version} (2024-25)" → "Deepal S05 Max (2024-25)".
#                   Si no se pone, se usa "<nombre> <versión>".
#   descripcion     Texto libre.
#   fabricante      Marca que se muestra como "modelo" en la ficha.
#   paises          Lista de países (claves de countries.yaml) donde se ofrece.
#   reconocer       Cómo se identifica el coche en la lista de vehículos del
#                   servidor. Basta con que se cumpla UNA de las reglas:
#                     nombre_contiene:  textos que aparecen en "modelName" o
#                                       "seriesName" (sin distinguir mayúsculas).
#                     codigo_serie:     valores exactos de "seriesCode".
#   como            (opcional) Id de otro modelo del que se copia todo lo que
#                   aquí no se escriba. "funciones" se mezcla (solo hay que
#                   poner las que cambian); lo demás, si se escribe, sustituye.
#   funciones       Qué tiene el coche. Cada función desactivada (false) hace
#                   que NO se creen sus entidades. Lista de funciones posibles
#                   en docs/imagenes.md (sección "Funciones").
#   testigos_sin_aviso
#                   (opcional) Testigos que este coche enciende sin motivo: no
#                   mandan aviso ni salen en la tarjeta (su entidad sigue
#                   existiendo). Son nombres de señal, p. ej. warning_airbag.
#   carpeta_fotos   Carpeta dentro de vehicles/photos/ con las fotos del modelo.
#   foto_defecto    Foto que se usa si el usuario no ha elegido versión y color
#                   (o si falta la foto exacta). Ruta relativa a carpeta_fotos.
#   vistas          (opcional) Vistas por capas del modelo: el coche desde un
#                   ángulo, montado con capas según su estado (puertas, capó,
#                   maletero, ventanillas, luces). Cada vista es una entidad de
#                   imagen. Clave = vista; valor = carpeta dentro de vehicles/
#                   con su capas.yaml. Vistas posibles:
#                     top_view        "Vista planta" (desde arriba)
#                     isometric_view  "Vista isométrica" (delante-izquierda)
#                     interior_view   "Vista interior" (habitáculo: volante y
#                                     asientos calefactados / ventilados)
#                     charging_view   "Vista carga" (lateral con el cable
#                                     enchufado / cargando)
#                   Sin este campo, el modelo no tiene vistas.
#   llantas         (opcional) Llantas que el usuario puede elegir en
#                   el panel DEC Deepal → Coches → Apariencia. La primera es la de por defecto
#                   (la que ya está dibujada en la base de las vistas). Cada
#                   una, salvo la primera, necesita su capa wheels_<id>.png.
#                   El nombre visible está en translations (selector "wheels").
#   manual          (opcional) Enlace al manual de usuario en PDF. La tarjeta
#                   lo abre en el navegador desde "Otros → Manual". El usuario puede cambiarlo
#                   en el panel DEC Deepal → Ajustes.
#   mantenimiento   (opcional) Plan de mantenimiento del manual del coche.
#                     intervalo_km / intervalo_meses
#                                   Cada cuánto toca la revisión (lo que llegue
#                                   antes). Por defecto, 20000 km y 12 meses.
#                     operaciones   Lista de lo que se hace en las revisiones:
#                       clave       Nombre traducido: su texto está en
#                                   idiomas/<idioma>.json → catalogo →
#                                   "operacion_<clave>" (ver docs/idiomas.md).
#                       nombre      (en vez de clave) Texto escrito aquí, en un
#                                   solo idioma o uno por idioma: {es: ..., en: ...}.
#                       cada        (opcional) Cada cuántas revisiones toca:
#                                   1 = en todas (por defecto), 2 = en la 2.ª,
#                                   4.ª, 6.ª..., 3 = en la 3.ª, 6.ª, 9.ª...
#                       versiones   (opcional) Solo en estas versiones.
#   versiones       Acabados. Clave = id interno (minúsculas, sin espacios).
#                     nombre        Texto que ve el usuario.
#                     descripcion   Texto libre.
#                     grupo_foto    Prefijo del nombre de la foto. Versiones que
#                                   son iguales por fuera comparten grupo.
#                     funciones     (opcional) cambia funciones del modelo solo
#                                   para esta versión.
#                     llanta        (opcional) Llanta fija de esta versión (no
#                                   se puede elegir otra).
#                     verificada    (opcional) true si la ficha de esta versión
#                                   se ha comprobado en un coche real.
#                     bateria_kwh   (opcional) Capacidad útil de la batería en
#                                   kWh. Con ella, los cargadores estiman el %
#                                   que sube el coche cuando no tiene cobertura.
#   colores         Colores oficiales. Clave = id interno.
#                     nombre        Nombre comercial.
#                     descripcion   Texto libre.
#                     muestra       (opcional) Color aproximado, "#rrggbb": es
#                                   el círculo que se pulsa en el panel.
#
# -----------------------------------------------------------------------------
# NOMBRE DE LAS FOTOS
# -----------------------------------------------------------------------------
#   vehicles/photos/<carpeta_fotos>/<grupo_foto>_<color>.png
#   Ejemplo: vehicles/photos/s05_2024/max_andromeda_blue.png
#   Formatos admitidos: .png, .jpg, .jpeg, .webp (se busca en ese orden).
#   Si falta la foto exacta, se usa foto_defecto. No hace falta tocar código.
#   Llantas: con una llanta elegible que no es la primera de "llantas" (p. ej.
#   "open", sin tapacubos), se usa <grupo_foto>_<color>_<llanta>.png si existe
#   (ej.: max_andromeda_blue_open.png; las genera
#   tools/generar_vista_lateral_llanta.py).
#
# -----------------------------------------------------------------------------
# MODELO "generico"
# -----------------------------------------------------------------------------
#   Es el modelo con el que ARRANCA todo coche hasta que el usuario elige el
#   suyo (el panel DEC Deepal → Coches → Apariencia, o el aviso "Configura tu vehículo" en
#   Ajustes → Reparaciones). Tiene solo las funciones básicas y ninguna foto
#   propia: así nunca se crean entidades de funciones que el coche no tiene.
#   También se usa para coches aún no catalogados.
# =============================================================================

modelos:
  # --- Deepal S05 eléctrico (EV) ----------------------------------------------
  # El id sigue siendo "s05_2024" (es el que tienen guardado los usuarios).
  s05_2024:
    nombre: Deepal S05 EV
    nombre_con_version: Deepal S05 EV {version}
    descripcion: >-
      SUV eléctrico compacto. Modelo de referencia del proyecto, probado con
      coches reales en España (RWD Max).
    fabricante: Changan Deepal
    paises: [es, pt, it, de, fr]
    reconocer:
      nombre_contiene: ["S05"]
      codigo_serie: []
    # El coche enciende el testigo del airbag unos segundos cada vez que
    # despierta (visto en dos RWD Max, 10-2026). Hasta saber cuánto dura
    # (historial de los diagnósticos) y poder filtrarlo, no avisa.
    testigos_sin_aviso: [warning_airbag]
    funciones:
      telemetria_mqtt: true          # lee el estado por MQTT (rápido y completo)
      climatizacion: true            # encender/apagar y temperatura
      luces_claxon: true             # parpadear luces / tocar claxon
      asientos_calefaccion: true     # calefacción asientos delanteros 0-3 (el Pro no)
      asientos_ventilacion: true     # ventilación asientos delanteros 0-3 (el Pro no)
      volante_calefactado: true      # (el Pro no)
      desempanado: false             # el S05 no es compatible (probado 02-10-2026)
      comandos_pin: true             # puertas, ventanillas y maletero (con PIN)
      porton_electrico: true         # abrir/cerrar el maletero a distancia (el Pro no)
      combustible: false             # solo híbridos enchufables / autonomía extendida
    carpeta_fotos: s05_2024
    foto_defecto: default.png
    # Max: 20" con tapacubos (cover) o sin él (open). El Pro lleva 18" (abajo).
    llantas: [cover, open]
    vistas:
      top_view: vista_planta/s05_2024
      isometric_view: vista_isometrica/s05_2024
      interior_view: vista_interior/s05_2024
      charging_view: vista_carga/s05_2024
    # Manual del S05 eléctrico (BEV) para España, en la web de Changan Europe.
    manual: "https://www.changaneurope.com/Portals/8/adam/ContentBlocks/GYOzlGfAJk-2eKURqlUQ8g/Path/Manual%20de%20usuario%20S05.pdf"
    # Manual de usuario del S05 (España), "Tabla de Mantenimiento Periódico":
    # revisión cada 20.000 km o 12 meses. Las operaciones con intervalo propio
    # se colocan en la revisión en la que se cumple su plazo en años.
    mantenimiento:
      intervalo_km: 20000
      intervalo_meses: 12
      operaciones:
        - clave: general_inspection
        - clave: tyres
        - clave: cabin_filter
        - clave: condenser_cleaning
        - clave: electrics_inspection
          cada: 2
        - clave: brake_fluid
          cada: 2
        - clave: coolant
          cada: 3
        - clave: front_gear_oil
          cada: 3
          versiones: [max_awd]
        - clave: rear_gear_oil
          cada: 5
    versiones:
      pro:
        nombre: RWD Pro
        descripcion: >-
          Versión de acceso, propulsión trasera. Según el catálogo oficial no
          lleva asientos calefactados ni ventilados, volante calefactado ni
          portón eléctrico. Sin verificar en un coche real.
        grupo_foto: pro
        llanta: pro                  # 18" con su tapacubos
        bateria_kwh: 56.1            # catálogo oficial (sin verificar)
        funciones:
          asientos_calefaccion: false
          asientos_ventilacion: false
          volante_calefactado: false
          porton_electrico: false
      max:
        nombre: RWD Max
        descripcion: >-
          Versión alta, propulsión trasera. Asientos calefactados y
          ventilados, volante calefactado y portón eléctrico.
        grupo_foto: max
        verificada: true             # dos coches reales (10-2026)
        bateria_kwh: 68.8            # catálogo oficial
      max_awd:
        nombre: 4WD Max
        descripcion: >-
          Tracción total ("Max AWD" en el catálogo). Mismo equipamiento que el
          RWD Max y, por fuera, idéntica: comparte sus fotos (grupo_foto: max).
          Sin verificar en un coche real.
        grupo_foto: max
        bateria_kwh: 68.8            # catálogo oficial (sin verificar)
    colores:
      andromeda_blue:
        nombre: Andromeda Blue
        descripcion: Azul.
        muestra: "#2f4a6b"
      deep_space_black:
        nombre: Deep Space Black
        descripcion: Negro.
        muestra: "#16181b"
      ganymade_grey:                 # (el id conserva la errata: lo tienen guardado los usuarios)
        nombre: Ganymede Grey
        descripcion: Gris.
        muestra: "#5d6166"
      mercury_silver:
        nombre: Mercury Silver
        descripcion: Plata.
        muestra: "#b9bdc1"
      moonlight_white:
        nombre: Moonlight White
        descripcion: Blanco.
        muestra: "#f2f3f4"

  # --- Deepal S05 híbrido enchufable (PHEV) -----------------------------------
  # Equipamiento según el catálogo oficial (2026): dos versiones, Pro y
  # Limited Edition (equivale al Max), las dos de tracción delantera y con
  # la misma llanta de 18" que el EV Pro. No hay 4WD. Manual y plan de
  # mantenimiento: los oficiales (manual de usuario, julio de 2026). Nadie
  # del proyecto tiene uno todavía: lo que el coche envía de verdad, y lo
  # marcado con (?), hay que confirmarlo con el diagnóstico de un PHEV.
  s05_phev:
    como: s05_2024
    nombre: Deepal S05 PHEV
    nombre_con_version: Deepal S05 PHEV {version}
    descripcion: >-
      SUV híbrido enchufable, tracción delantera. Equipamiento según el
      catálogo oficial; sin verificar en un coche real.
    reconocer:
      nombre_contiene: ["PHEV"]      # (?) se supone que el código de modelo lo lleva
      codigo_serie: []
    funciones:
      combustible: true              # depósito y autonomía de gasolina (sin entidades todavía)
    # Manual del S05 híbrido enchufable (PHEV) para España, en la web de Changan Europe.
    manual: "https://www.changaneurope.com/Portals/8/adam/ContentBlocks/lrfUbgl1KEGWVm6dnA8VPQ/Path/202607_S05_PHEV_Manual_de_Usuario_ES-compressed.pdf"
    # Manual de usuario del S05 PHEV (España, julio de 2026), "Tabla de
    # Mantenimiento Periódico": revisión cada 20.000 km o 12 meses. Como el EV,
    # más el motor de gasolina; la transmisión eléctrica va delante (no hay
    # reductor trasero). Las operaciones con intervalo propio se colocan en la
    # revisión en la que se cumple su plazo en años.
    mantenimiento:
      intervalo_km: 20000
      intervalo_meses: 12
      operaciones:
        - clave: general_inspection
        - clave: engine_oil              # aceite y filtro: en todas las revisiones
        - clave: fuel_system
        - clave: tyres
        - clave: cabin_filter
        - clave: condenser_cleaning
        - clave: electrics_inspection
          cada: 2
        - clave: brake_fluid
          cada: 2
        - clave: spark_plugs
          cada: 2
        - clave: engine_air_filter
          cada: 2
        - clave: coolant
          cada: 3
        - clave: front_gear_oil
          cada: 3
    versiones:
      pro:
        nombre: Pro
        descripcion: >-
          Versión de acceso. Como el EV Pro: sin asientos calefactados ni
          ventilados, volante calefactado ni portón eléctrico.
        grupo_foto: pro
        llanta: pro                  # 18"
        bateria_kwh: 18.4            # catálogo oficial (sin verificar)
        funciones:
          asientos_calefaccion: false
          asientos_ventilacion: false
          volante_calefactado: false
          porton_electrico: false
      limited_edition:
        nombre: Limited Edition
        descripcion: >-
          Versión alta (el "Max" del PHEV): asientos calefactados y
          ventilados, volante calefactado y portón eléctrico.
        grupo_foto: max
        llanta: pro                  # la misma de 18" que los Pro
        bateria_kwh: 18.4            # catálogo oficial (sin verificar)

  generico:
    nombre: Deepal (sin configurar)
    descripcion: >-
      Perfil inicial de todo coche hasta que se elige su modelo, y de respaldo
      para coches aún no catalogados. Solo lectura de datos básicos y comandos
      sin PIN.
    fabricante: Changan Deepal
    paises: [es, pt, it, de, fr]
    reconocer:
      nombre_contiene: []
      codigo_serie: []
    funciones:
      telemetria_mqtt: true
      climatizacion: true
      luces_claxon: true
      asientos_calefaccion: false
      asientos_ventilacion: false
      volante_calefactado: false
      desempanado: false
      comandos_pin: false
      porton_electrico: false
      combustible: false
    testigos_sin_aviso: [warning_airbag]
    carpeta_fotos: generico
    foto_defecto: default.png
    versiones: {}
    colores: {}
