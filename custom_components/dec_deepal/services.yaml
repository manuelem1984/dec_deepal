# Definición de los servicios de DEC Deepal. Los textos visibles (nombre,
# descripción de cada campo) están en translations/<idioma>.json → services.

capture_snapshot:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: dec_deepal
    label:
      required: false
      example: "A - coche cerrado en reposo"
      selector:
        text:
    refresh:
      required: false
      default: true
      selector:
        boolean:

register_maintenance:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: dec_deepal
    date:
      required: false
      selector:
        date:
    km:
      required: false
      selector:
        number:
          min: 0
          max: 2000000
          unit_of_measurement: km
          mode: box

register_itv:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: dec_deepal
    date:
      required: false
      selector:
        date:
