charge_current:
  plataforma: sensor
  descripcion: Corriente de carga (AC o DC)
ac_charge_current:
  plataforma: sensor
  descripcion: Corriente de carga AC
  defecto: mdi:current-ac
dc_charge_current:
  plataforma: sensor
  descripcion: Corriente de carga DC
  defecto: mdi:current-dc
remaining_charge_time:
  plataforma: sensor
  descripcion: Tiempo de carga restante (minutos)
  defecto: mdi:timer-sand
remaining_charge_time_hhmm:
  plataforma: sensor
  descripcion: Tiempo de carga restante (H:MM)
  defecto: mdi:timer-sand
inside_temperature:
  plataforma: sensor
  descripcion: Temperatura interior
outside_temperature:
  plataforma: sensor
  descripcion: Temperatura exterior
  defecto: mdi:thermometer
cabin_humidity:
  plataforma: sensor
  descripcion: Humedad interior
climate_target_temperature:
  plataforma: sensor
  descripcion: Temperatura objetivo del climatizador
  defecto: mdi:thermostat
fan_level:
  plataforma: sensor
  descripcion: Nivel del ventilador del climatizador
  defecto: mdi:fan
tire_pressure_front_left:
  plataforma: sensor
  descripcion: Presión neumático delantero izquierdo
  defecto: mdi:car-tire-alert
tire_pressure_front_right:
  plataforma: sensor
  descripcion: Presión neumático delantero derecho
  defecto: mdi:car-tire-alert
tire_pressure_rear_left:
  plataforma: sensor
  descripcion: Presión neumático trasero izquierdo
  defecto: mdi:car-tire-alert
tire_pressure_rear_right:
  plataforma: sensor
  descripcion: Presión neumático trasero derecho
  defecto: mdi:car-tire-alert
power_status:
  plataforma: sensor
  descripcion: Estado de alimentación (código en bruto)
  defecto: mdi:car-cog
speed:
  plataforma: sensor
  descripcion: Velocidad
  defecto: mdi:speedometer
trip_mileage:
  plataforma: sensor
  descripcion: Kilómetros del trayecto actual
  defecto: mdi:map-marker-path
mileage_yesterday:
  plataforma: sensor
  descripcion: Kilómetros recorridos ayer
  defecto: mdi:calendar-arrow-left

