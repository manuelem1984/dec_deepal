    "off": {archivo: ok, mdi: mdi:tire}
  defecto: mdi:tire
tire_alarm_front_right:
  plataforma: binary_sensor
  descripcion: Aviso neumático delantero derecho
  estados:
    "on": {archivo: alert, mdi: mdi:car-tire-alert}
    "off": {archivo: ok, mdi: mdi:tire}
  defecto: mdi:tire
tire_alarm_rear_left:
  plataforma: binary_sensor
  descripcion: Aviso neumático trasero izquierdo
  estados:
    "on": {archivo: alert, mdi: mdi:car-tire-alert}
    "off": {archivo: ok, mdi: mdi:tire}
  defecto: mdi:tire
tire_alarm_rear_right:
  plataforma: binary_sensor
  descripcion: Aviso neumático trasero derecho
  estados:
    "on": {archivo: alert, mdi: mdi:car-tire-alert}
    "off": {archivo: ok, mdi: mdi:tire}
  defecto: mdi:tire
high_beam:
  plataforma: binary_sensor
  descripcion: Luces de Carretera
  estados:
    "on": {mdi: mdi:car-light-high}
    "off": {mdi: mdi:car-light-high}
low_beam:
  plataforma: binary_sensor
  descripcion: Luces de Cruce
  estados:
    "on": {mdi: mdi:car-light-dimmed}
    "off": {mdi: mdi:car-light-dimmed}
position_lamp:
  plataforma: binary_sensor
  descripcion: Luces de posición (comprobado con el coche, 05-10-2026)
  estados:
    "on": {mdi: mdi:car-parking-lights}
    "off": {mdi: mdi:car-parking-lights}
indicator_left:
  plataforma: binary_sensor
  descripcion: Intermitente izquierdo
  estados:
    "on": {mdi: mdi:arrow-left-bold-circle}
    "off": {mdi: mdi:arrow-left-bold-circle-outline}
indicator_right:
  plataforma: binary_sensor
  descripcion: Intermitente derecho
  estados:
    "on": {mdi: mdi:arrow-right-bold-circle}
    "off": {mdi: mdi:arrow-right-bold-circle-outline}
climate_on:
  plataforma: binary_sensor
  descripcion: Climatizador encendido
  estados:
    "on": {mdi: mdi:air-conditioner}
    "off": {mdi: mdi:fan-off}

# ---------------------------------------------------------------------------
# BOTONES
# ---------------------------------------------------------------------------
refresh:
  plataforma: button
  descripcion: Pedir datos frescos al coche
  defecto: mdi:refresh
flash_lights:
  plataforma: button
  descripcion: Parpadear luces
  defecto: mdi:car-light-alert
honk_horn:
  plataforma: button
  descripcion: Tocar el claxon
  defecto: mdi:bullhorn
flash_and_honk:
  plataforma: button
  descripcion: Luces y claxon a la vez
  defecto: mdi:alarm-light

# ---------------------------------------------------------------------------
# CONTROLES
# ---------------------------------------------------------------------------
cabin_climate:
  plataforma: climate
  descripcion: Climatización del habitáculo
  estados:
    "off": {mdi: mdi:fan-off}
    heat_cool: {mdi: mdi:air-conditioner}
seat_heat_driver:
  plataforma: number
  descripcion: Calefacción asiento conductor (0-3)
  defecto: mdi:car-seat-heater
seat_heat_passenger:
  plataforma: number
  descripcion: Calefacción asiento acompañante (0-3)
  defecto: mdi:car-seat-heater
seat_vent_driver:
  plataforma: number
  descripcion: Ventilación asiento conductor (0-3)
  defecto: mdi:car-seat-cooler
seat_vent_passenger:
  plataforma: number
  descripcion: Ventilación asiento acompañante (0-3)
  defecto: mdi:car-seat-cooler
steering_wheel_heat:
  plataforma: switch
  descripcion: Volante calefactado
  defecto: mdi:steering
front_defrost:
  plataforma: switch
  descripcion: Desempañado delantero
  defecto: mdi:car-defrost-front
doors:
  plataforma: lock
  descripcion: Cierre centralizado (control con PIN)
  estados:
    locked: {mdi: mdi:car-door-lock}
    unlocked: {mdi: mdi:car-door-lock-open}
pin_arm:
  plataforma: lock
  descripcion: Desbloqueo acciones con PIN (Opción B)
  estados:
    locked: {mdi: mdi:lock}
    unlocked: {mdi: mdi:lock-open-outline}
windows:
  plataforma: cover
  descripcion: >-
    Ventanillas - Modo Ventilación (entreabrir con PIN). OJO: el estado de HA
    está invertido ("open" = ventanillas CERRADAS), por eso los archivos se
    llaman por lo que pasa de verdad.
  estados:
    open: {archivo: closed, mdi: mdi:window-closed-variant}   # cerradas de verdad
    closed: {archivo: vent, mdi: mdi:window-open-variant}     # ventilando
  defecto: mdi:window-closed-variant
trunk_control:
  plataforma: cover
  descripcion: Maletero (control con PIN)
  estados:
    open: {mdi: mdi:car-back}
    closed: {mdi: mdi:car-back}

# ---------------------------------------------------------------------------
# DATOS FIJOS Y UBICACIÓN (la ubicación, deshabilitada: hoy el S05 no la envía)
# ---------------------------------------------------------------------------
license_plate:
  plataforma: sensor
  descripcion: Matrícula (plateNumber de la lista de vehículos)
  defecto: mdi:card-text-outline
location:
  plataforma: device_tracker
  descripcion: Ubicación del coche (si el servidor la envía)
  defecto: mdi:car-search

# ---------------------------------------------------------------------------
# IMÁGENES
# ---------------------------------------------------------------------------
official_image:
  plataforma: image
  descripcion: Imagen oficial que envía el servidor de Deepal
dec_photo:
  plataforma: image
  descripcion: Imagen DEC según versión y color elegidos
top_view:
  plataforma: image
  descripcion: >-
    Vista de planta: el coche desde arriba con puertas, capó, maletero,
    ventanillas y luces según su estado (capas en vehicles/vista_planta/)
isometric_view:
  plataforma: image
  descripcion: >-
    Vista isométrica: el coche desde delante a la izquierda con puertas, capó,
    maletero, ventanillas y luces según su estado (capas en vehicles/vista_isometrica/)
interior_view:
  plataforma: image
  descripcion: >-
    Vista interior: el habitáculo desde arriba con volante y asientos
    delanteros encendidos (naranja = calor, celeste = ventilación)
charging_view:
  plataforma: image
  descripcion: >-
    Vista de carga: el coche de lado con el cable enchufado (gris) o cargando
    (verde)

