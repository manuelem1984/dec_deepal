    connected_ac: {mdi: mdi:ev-plug-type2}
    connected_dc: {mdi: mdi:ev-plug-ccs2}
    charging_ac: {mdi: mdi:lightning-bolt-outline}
    charging_dc: {mdi: mdi:flash-outline}
