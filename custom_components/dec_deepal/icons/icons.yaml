  descripcion: Coche encendido (estado de alimentación distinto de 0)
  estados:
    "on": {mdi: mdi:power}
    "off": {mdi: mdi:power-off}
charging:
  plataforma: binary_sensor
  descripcion: Cargando
  estados:
    "on": {mdi: mdi:lightning-bolt}
    "off": {mdi: mdi:lightning-bolt-outline}
ac_connector:
  plataforma: binary_sensor
  descripcion: Manguera AC (Tipo 2) enchufada
  defecto: mdi:ev-plug-type2
dc_connector:
  plataforma: binary_sensor
  descripcion: Manguera DC (CCS2) enchufada
  defecto: mdi:ev-plug-ccs2
door_front_left:
  plataforma: binary_sensor
  descripcion: Puerta delantera izquierda
  estados:
    "on": {archivo: open, mdi: mdi:car-door}
    "off": {archivo: closed, mdi: mdi:car-door}
door_front_right:
  plataforma: binary_sensor
  descripcion: Puerta delantera derecha
  estados:
    "on": {archivo: open, mdi: mdi:car-door}
    "off": {archivo: closed, mdi: mdi:car-door}
door_rear_left:
  plataforma: binary_sensor
  descripcion: Puerta trasera izquierda
  estados:
    "on": {archivo: open, mdi: mdi:car-door}
    "off": {archivo: closed, mdi: mdi:car-door}
door_rear_right:
  plataforma: binary_sensor
  descripcion: Puerta trasera derecha
  estados:
    "on": {archivo: open, mdi: mdi:car-door}
    "off": {archivo: closed, mdi: mdi:car-door}
trunk:
  plataforma: binary_sensor
  descripcion: Maletero (lectura)
  estados:
    "on": {archivo: open}
    "off": {archivo: closed}
hood:
  plataforma: binary_sensor
  descripcion: Capó
  estados:
    "on": {archivo: open}
    "off": {archivo: closed}
any_door_open:
  plataforma: binary_sensor
  descripcion: Alguna puerta o el maletero abiertos
  estados:
    "on": {archivo: open, mdi: mdi:car-door}
    "off": {archivo: closed, mdi: mdi:car}
window_front_left:
  plataforma: binary_sensor
  descripcion: Ventanilla delantera izquierda
  estados:
    "on": {archivo: open, mdi: mdi:window-open-variant}
    "off": {archivo: closed, mdi: mdi:window-closed-variant}
window_front_right:
  plataforma: binary_sensor
  descripcion: Ventanilla delantera derecha
  estados:
    "on": {archivo: open, mdi: mdi:window-open-variant}
    "off": {archivo: closed, mdi: mdi:window-closed-variant}
window_rear_left:
  plataforma: binary_sensor
  descripcion: Ventanilla trasera izquierda
  estados:
    "on": {archivo: open, mdi: mdi:window-open-variant}
    "off": {archivo: closed, mdi: mdi:window-closed-variant}
window_rear_right:
  plataforma: binary_sensor
  descripcion: Ventanilla trasera derecha
  estados:
    "on": {archivo: open, mdi: mdi:window-open-variant}
    "off": {archivo: closed, mdi: mdi:window-closed-variant}
lock_driver:
  plataforma: binary_sensor
  descripcion: Cerradura puerta del conductor (on = desbloqueada)
  estados:
    "on": {archivo: unlocked, mdi: mdi:car-door-lock-open}
    "off": {archivo: locked, mdi: mdi:car-door-lock}
lock_passenger:
  plataforma: binary_sensor
  descripcion: Cerradura puerta del acompañante (on = desbloqueada)
  estados:
    "on": {archivo: unlocked, mdi: mdi:car-door-lock-open}
    "off": {archivo: locked, mdi: mdi:car-door-lock}
central_locking:
  plataforma: binary_sensor
  descripcion: Cierre centralizado (on = desbloqueado)
  estados:
    "on": {archivo: unlocked, mdi: mdi:lock-open-variant}
    "off": {archivo: locked, mdi: mdi:lock}
tire_alarm_front_left:
