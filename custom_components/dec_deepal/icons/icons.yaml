# =============================================================================
# DEC Deepal — Registro de ICONOS de cada entidad
# =============================================================================
#
# Idea: cambiar el icono de una entidad SIN tocar código. Basta con dejar un
# archivo .svg con el nombre correcto en la carpeta icons/svg/ y reiniciar
# Home Assistant (y refrescar el navegador con Ctrl+F5).
#
# Guía completa, con ejemplos y requisitos del SVG: docs/iconos.md
#
# -----------------------------------------------------------------------------
# CÓMO SE ELIGE EL ICONO (en este orden; gana el primero que exista)
# -----------------------------------------------------------------------------
#   1. icons/svg/<entidad>_<sufijo>.svg   icono propio para ESE estado
#   2. icons/svg/<entidad>.svg            icono propio para TODOS los estados
#   3. "mdi" del estado (abajo)           icono de Home Assistant para ese estado
#   4. "defecto" (abajo)                  icono de Home Assistant general
#   5. nada                               icono estándar de HA según el tipo
#
#   <entidad>  = la clave de cada bloque de este fichero (p. ej. "windows").
#   <sufijo>   = el "archivo" del estado; si no se indica, el propio estado.
#
#   Ejemplo "windows" (ventanillas):
#     icons/svg/windows_open.svg     → cuando están abiertas
#     icons/svg/windows_closed.svg   → cuando están cerradas
#     icons/svg/windows.svg          → siempre (si no hay los anteriores)
#
# -----------------------------------------------------------------------------
# ESTADOS POR TIPO DE ENTIDAD (lo que Home Assistant llama "estado")
# -----------------------------------------------------------------------------
#   binary_sensor  "on" / "off"    ← ¡ENTRE COMILLAS! Sin comillas, YAML los
#                                     convierte en true/false (se tolera, pero
#                                     mejor evitarlo).
#   switch         "on" / "off"
#   cover          open / closed / opening / closing
#   lock           locked / unlocked
#   climate        "off" / heat_cool
#   number         el nivel: "0", "1", "2", "3"
#   sensor enum    cada opción (p. ej. charging_ac)
#   sensor normal, button, image → no tienen estados: solo <entidad>.svg
#
# -----------------------------------------------------------------------------
# CAMPOS DE CADA ENTIDAD
# -----------------------------------------------------------------------------
#   plataforma   Tipo de entidad en Home Assistant (solo informativo y para
#                validar).
#   descripcion  Qué es (en español).
#   estados      (opcional) Estado → {archivo: sufijo, mdi: icono de respaldo}
#   defecto      (opcional) Icono de respaldo si el estado no está en la lista.
#
# Al añadir una ENTIDAD NUEVA a la integración, añade aquí su bloque: así
# queda documentado qué nombres de archivo acepta. Al arrancar, en el registro
# de Home Assistant aparece un aviso si hay un .svg que no corresponde a
# ninguna entidad (útil para detectar erratas en el nombre).
# =============================================================================

# ---------------------------------------------------------------------------
# SENSORES
# ---------------------------------------------------------------------------
battery_level:
  plataforma: sensor
  descripcion: Nivel de batería (%)
range:
  plataforma: sensor
  descripcion: Autonomía estimada (km)
  defecto: mdi:map-marker-distance
maintenance_days:
  plataforma: sensor
  descripcion: Días que quedan para la próxima revisión (negativo = vencida)
  defecto: mdi:calendar-clock
maintenance_km:
  plataforma: sensor
  descripcion: Kilómetros que quedan para la próxima revisión (negativo = vencida)
  defecto: mdi:road-variant
maintenance_date:
  plataforma: sensor
  descripcion: Fecha prevista de la próxima revisión
  defecto: mdi:calendar-check
odometer:
  plataforma: sensor
  descripcion: Kilometraje total
  defecto: mdi:counter
last_update:
