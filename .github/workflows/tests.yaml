# Ejecuta las pruebas y el linter en cada push y pull request.
#
# Las máquinas van fijadas a Ubuntu 24.04 (no "ubuntu-latest") para que el
# salto de GitHub a Ubuntu 26 no cambie el entorno sin avisar: Playwright
# instala dependencias del sistema y puede no soportar una versión recién salida.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements_test.txt
      - name: Pruebas
        run: pytest -v

  # La tarjeta, en un navegador (no necesita Home Assistant). Ver docs/tarjeta.md
  tarjeta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests_tarjeta/requirements.txt
      - name: Instalar dependencias
        run: |
          pip install -r tests_tarjeta/requirements.txt
          playwright install --with-deps chromium
      - name: Tarjeta al día
        run: python tools/construir_tarjeta.py --check
      - name: Pruebas de la tarjeta
        run: pytest -v -c tests_tarjeta/pytest.ini tests_tarjeta

  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          args: check .
