# Ejecuta las pruebas y el linter en cada push y pull request.
#
# Las máquinas van fijadas a Ubuntu 24.04 (no "ubuntu-latest") para que el
# salto de GitHub a Ubuntu 26 no cambie el entorno sin avisar: Playwright
# instala dependencias del sistema y puede no soportar una versión recién salida.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  # Las pruebas con dos Home Assistant: la última probada y la mínima que admite
  # la integración (hacs.json). Las dos con versiones fijadas.
  pytest:
    name: Pruebas (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.10"
            requirements: requirements_test.txt
          - ha: "2026.3 (mínima)"
            requirements: requirements_test_min.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Instalar dependencias
        run: pip install -r ${{ matrix.requirements }}
      - name: Pruebas
        run: pytest -v

  # La tarjeta, en un navegador (no necesita Home Assistant). Ver docs/tarjeta.md
  tarjeta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests_tarjeta/requirements.txt
      - name: Instalar dependencias
        run: |
          pip install -r tests_tarjeta/requirements.txt
          playwright install --with-deps chromium
      - name: Tarjeta al día
        run: python tools/construir_tarjeta.py --check
      - name: Pruebas de la tarjeta
        run: pytest -v -c tests_tarjeta/pytest.ini tests_tarjeta

  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Desde la v4 sus releases son inmutables y no hay etiqueta "v4": versión exacta.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check .
