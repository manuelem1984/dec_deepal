# Validaciones oficiales: HACS (estructura del repositorio) y hassfest
# (manifest, traducciones, servicios...).
name: Validación

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
